name: Release CLI

# Push a tag like cli-v0.2.0 on main. npm trusted publishing needs no token, and npm shows the provenance.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches the CLI version and is on main
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          [ "$GITHUB_REF_NAME" = "cli-v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match apps/cli version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dungeons-and-deploys test
      - run: pnpm --filter dungeons-and-deploys build
      - run: npm publish --ignore-scripts
        working-directory: apps/cli
      - run: gh release create "$GITHUB_REF_NAME" --title "CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
